<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أثر للتدريب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #000;
      font-family: 'Inter', 'Tajawal', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: #000; color: #fff; }

    .page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* === NAVBAR === */
    .nav-bar {
      position: fixed;
      top: 0;
      inset-inline: 0;
      width: 100%;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      pointer-events: none;
      animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes slideDown {
      from { transform: translateY(-16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .nav-logo-text {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      color: #000;
      display: none;
    }

    .nav-menu-btn {
      display: flex;
      align-items: center;
      background-color: #000;
      color: #fff;
      border: 1px solid rgba(0,0,0,0.03);
      padding: 4px;
      padding-inline-end: 16px;
      gap: 8px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-menu-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-menu-label {
      font-size: 11px;
      font-weight: 500;
      padding-inline-start: 2px;
    }

    .nav-tags {
      display: none;
      align-items: center;
      background-color: #F4F4F6;
      border: 1px solid rgba(0,0,0,0.03);
      border-radius: 9999px;
      padding: 0 24px;
      height: 40px;
      font-size: 11px;
      font-weight: 400;
      color: rgba(0,0,0,0.55);
      gap: 20px;
      user-select: none;
    }

    .nav-right { pointer-events: auto; }

    .nav-right-pill {
      display: flex;
      align-items: center;
      background-color: #F4F4F6;
      border-radius: 9999px;
      padding: 4px;
      padding-inline-end: 16px;
      gap: 10px;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .nav-right-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
    }

    .nav-right-label {
      font-size: 11px;
      font-weight: 500;
      color: rgba(0,0,0,0.65);
      user-select: none;
      display: none;
    }

    /* === VIDEO === */
    .video-container {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      width: 80%;
      height: 80%;
      /* fallback backdrop shown if the video fails to load (never blank white) */
      background: radial-gradient(120% 80% at 70% 20%, #f4f4f6 0%, #e9e9ee 45%, #d8d8df 100%);
      border-radius: 12px;
      overflow: hidden;
      animation: videoFadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes videoFadeIn {
      from { opacity: 0; transform: scale(1.05); }
      to { opacity: 1; transform: scale(1); }
    }

    .video-wrapper video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* === SPACER === */
    .spacer { flex: 1; position: relative; z-index: 10; }

    /* === FOOTER === */
    .bottom-footer {
      width: 100%;
      position: relative;
      z-index: 30;
      padding: 32px 20px 40px;
      background: linear-gradient(to top, #ffffff 0%, rgba(255,255,255,0.8) 50%, transparent 100%);
    }

    .footer-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      opacity: 0;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 540px;
    }

    .footer-subtitle {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideUpSmall 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      opacity: 0;
    }

    @keyframes slideUpSmall {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .footer-subtitle .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: rgba(0,0,0,0.75);
      flex-shrink: 0;
    }

    .footer-subtitle span {
      font-size: 13px;
      color: rgba(0,0,0,0.55);
    }

    .footer-heading {
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #000;
      animation: slideUpMedium 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      opacity: 0;
    }

    @keyframes slideUpMedium {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .footer-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      animation: slideUpSmall 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
      opacity: 0;
    }

    .btn-primary {
      padding: 12px 22px;
      background-color: #000;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-outline {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background-color: transparent;
      border: 1px solid rgba(0,0,0,0.35);
      color: #000;
      font-size: 13px;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
    }

    .footer-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .tag-button {
      padding: 10px 18px;
      border: 1px solid rgba(0,0,0,0.12);
      color: #000;
      font-size: 11px;
      font-weight: 400;
      border-radius: 9999px;
      background-color: #fff;
      cursor: pointer;
      font-family: inherit;
    }

    /* === DESKTOP 768px+ === */
    @media (min-width: 768px) {
      .nav-bar { padding: 24px 32px; }
      .nav-left { gap: 12px; }
      .nav-logo-text { display: inline; font-size: 17px; }
      .nav-menu-btn { padding: 4px; padding-inline-end: 20px; gap: 10px; }
      .nav-menu-icon { width: 32px; height: 32px; }
      .nav-tags { display: flex; }
      .nav-right-pill { padding: 4px; padding-inline-end: 24px; gap: 14px; }
      .nav-right-icon { width: 32px; height: 32px; }
      .nav-right-label { display: inline; }
      .video-wrapper { width: 100%; height: 100%; border-radius: 0; }
      .bottom-footer { padding: 40px 48px 56px; }
      .footer-inner { flex-direction: row; align-items: flex-end; gap: 32px; }
      .footer-left { gap: 24px; }
      .footer-heading { font-size: clamp(2.5rem, 5.5vw, 4.5rem); white-space: nowrap; }
      .btn-primary { padding: 13px 26px; }
      .btn-outline { padding: 13px 26px; }
      .tag-button { padding: 12px 22px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Navbar -->
    <nav class="nav-bar">
      <div class="nav-left">
        <div class="nav-logo">
          <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="19" width="15" height="5.5" rx="2.75" transform="rotate(-35 7 19)" fill="#000"/>
            <rect x="17.5" y="24" width="15" height="5.5" rx="2.75" transform="rotate(-35 17.5 24)" fill="#000"/>
          </svg>
          <span class="nav-logo-text">أثر</span>
        </div>

        <button class="nav-menu-btn">
          <div class="nav-menu-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
          <span class="nav-menu-label">القائمة</span>
        </button>

        <div class="nav-tags">
          <span>تصميم احترافي</span>
          <span>محتوى رقمي</span>
        </div>
      </div>

      <div class="nav-right">
        <div class="nav-right-pill">
          <button class="nav-right-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="5" r="2.2" fill="currentColor"/>
              <circle cx="12" cy="19" r="2.2" fill="currentColor"/>
              <circle cx="5" cy="12" r="2.2" fill="currentColor"/>
              <circle cx="19" cy="12" r="2.2" fill="currentColor"/>
              <path d="M12 7.5v9M7.5 12h9" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
            </svg>
          </button>
          <span class="nav-right-label">شركاء النجاح</span>
        </div>
      </div>
    </nav>

    <!-- Background Video -->
    <div class="video-container">
      <div class="video-wrapper">
        <video
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260508_215831_c6a8989c-d716-4d8d-8745-e972a2eec711.mp4"
          autoplay
          muted
          loop
          playsinline
        ></video>
      </div>
    </div>

    <!-- Spacer -->
    <main class="spacer"></main>

    <!-- Footer Content -->
    <footer class="bottom-footer">
      <div class="footer-inner">
        <div class="footer-left">
          <div class="footer-subtitle">
            <div class="dot"></div>
            <span>أفضل مركز تدريب إبداعي 2026</span>
          </div>

          <h2 class="footer-heading">
            <div>دورات احترافية،</div>
            <div>إبداع بلا حدود.</div>
          </h2>

          <div class="footer-buttons">
            <button class="btn-primary">استعرض الدورات</button>
            <button class="btn-outline">كيف نبدأ</button>
          </div>
        </div>

        <div class="footer-tags">
          <button class="tag-button">فوتوشوب</button>
          <button class="tag-button">إليستريتور</button>
          <button class="tag-button">إنديزاين</button>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
